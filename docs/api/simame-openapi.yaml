      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: limit
        schema:
          type: integer
      - in: query
        name: offset
        schema:
          type: integer
      - in: query
        name: target_type
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      tags:
      - api
      security:
      - BearerAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
