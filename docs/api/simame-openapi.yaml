  /api/v1/analytics/events/:
    post:
      operationId: api_v1_analytics_events_create
      description: |-
        POST a batch of client events. Authenticated; events are attributed to
        the requesting user and PII-redacted before persistence.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyticsBatchRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AnalyticsBatchRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AnalyticsBatchRequest'
        required: true
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/analytics/summary/:
    get:
      operationId: api_v1_analytics_summary_retrieve
      description: |-
        Admin-only summary metrics for the analytics dashboard.

        Lightweight aggregation over a date window (default 30 days): event totals,
        a daily active-users curve, and a top-events breakdown. Heavy cohort /
        materialized-view work is layered on top of this in later phases.
      tags:
      - api
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
