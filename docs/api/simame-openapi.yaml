components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        label:
          type: string
          description: Home, Work, etc.
          maxLength: 50
        address_line1:
          type: string
          title: Address line 1
          maxLength: 255
        city:
          type: string
          maxLength: 100
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line1
      - created_at
      - id
      - label
    AddressRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          description: Home, Work, etc.
          maxLength: 50
        address_line1:
