      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order:
          type: string
          format: uuid
        status:
          type: string
          maxLength: 50
        description:
          type: string
          nullable: true
        location_name:
          type: string
          nullable: true
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - order
      - status
      - timestamp
    TypeEnum:
