      - pricing_data
    SegmentEnum:
      enum:
      - ALL
      - ACTIVE
      - INACTIVE
      - PENDING_ORDERS
      - UNPAID
      - PROMO_OPT_IN
      - ABANDONED_BOOKING
      - REFERRAL
      - NEVER_ORDERED
      - CITY
      - CUSTOM
      type: string
      description: |-
        * `ALL` - All users
        * `ACTIVE` - Active users
        * `INACTIVE` - Inactive users
        * `PENDING_ORDERS` - Users with pending orders
        * `UNPAID` - Users with unpaid orders
        * `PROMO_OPT_IN` - Users opted into promotions
        * `ABANDONED_BOOKING` - Users with abandoned bookings
        * `REFERRAL` - Users who referred others
        * `NEVER_ORDERED` - Users who never ordered
        * `CITY` - Users in a city
        * `CUSTOM` - Custom (explicit user ids)
