    SpecialOffer:
      type: object
      description: |-
        ModelSerializer that maps model file/image fields to the safe variants.

        Auto-built fields keep their model-derived kwargs (validators, blank/null),
        but their read path degrades to ``None`` instead of raising when the
        storage backend is misconfigured or unreachable.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        image:
          type: string
          format: uri
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Order in carousel
        valid_until:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - image
      - title
    Status50cEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      - CHANGES_REQUESTED
      - SUSPENDED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `CHANGES_REQUESTED` - Changes Requested
        * `SUSPENDED` - Suspended
